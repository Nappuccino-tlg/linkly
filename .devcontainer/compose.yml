# Services for a Codespace, kept separate from the production docker-compose.yml on
# purpose: that file runs the shipped image and owns port 8000, which is exactly what a
# development container needs to be holding itself.
services:
  app:
    # The devcontainer base rather than python:3.12-slim. Matching the Dockerfile is the
    # right instinct for the image that ships and the wrong one here: slim carries no git,
    # no curl and no gh, so a Codespace built on it cannot even commit.
    image: mcr.microsoft.com/devcontainers/python:3.12
    volumes:
      - ..:/workspaces/linkly:cached
    working_dir: /workspaces/linkly
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://linkly:linkly@db:5432/linkly
      TEST_DATABASE_URL: postgresql+asyncpg://linkly:linkly@db:5432/linkly_test
      REDIS_URL: redis://redis:6379/0
      TEST_REDIS_URL: redis://redis:6379/15
      # A Codespace is a throwaway sandbox reachable only by the person who opened it.
      # ENVIRONMENT stays "development", so the production guards that would refuse these
      # values never run -- see app/config.py.
      JWT_SECRET: codespace-only-never-deploy-this
      BASE_URL: http://localhost:8000
      # coverage's default tracer loses a coroutine's frame when the loop resumes it.
      COVERAGE_CORE: sysmon

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: linkly
      POSTGRES_PASSWORD: linkly
      POSTGRES_DB: linkly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkly"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
