name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: linkly
          POSTGRES_PASSWORD: linkly
          POSTGRES_DB: linkly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linkly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://linkly:linkly@localhost:5432/linkly_test
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: ci-secret-not-used-outside-github-actions

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Same version as the Dockerfile base image, so what CI proves is what ships.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Check migrations match the models
        run: |
          alembic upgrade head
          alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://linkly:linkly@localhost:5432/linkly_test

      - name: Test
        run: pytest --cov-fail-under=85
