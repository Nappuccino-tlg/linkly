name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the Dockerfile ships, so it is the one that has to stay green.
        # 3.14 is there to find out whether the base image can move before the base image
        # moves -- Dependabot offered that bump and it would have changed what runs in
        # production without changing what CI proves.
        python-version: ["3.12", "3.14"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: linkly
          POSTGRES_PASSWORD: linkly
          POSTGRES_DB: linkly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linkly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://linkly:linkly@localhost:5432/linkly_test
      TEST_REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: ci-secret-not-used-outside-github-actions
      # coverage's default tracer loses a coroutine's frame when the event loop resumes
      # it, so every async handler was reported as covered up to its first await and
      # dark after it. sys.monitoring follows the resumption.
      COVERAGE_CORE: sysmon

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Check migrations match the models
        run: |
          alembic upgrade head
          alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://linkly:linkly@localhost:5432/linkly_test

      - name: Check the migrations lock nothing
        # 0002 built an index on `clicks` the blocking way for weeks before anything
        # noticed. Every redirect writes to that table, so the migration would have
        # stopped the site it was meant to speed up.
        run: |
          pip install lockcheck
          lockcheck

      - name: Test
        run: pytest --cov-fail-under=95

  quickstart:
    # The suite above imports the app in-process, which says nothing about the artifact
    # people actually run. This builds the image and walks the README's first page
    # against it: compose up, register, shorten, redirect, count, QR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
        env:
          JWT_SECRET: ci-secret-not-used-outside-github-actions

      - name: The container is not root
        # The Dockerfile creates uid 10001 and switches to it. A base image bump that
        # quietly lost that line would be invisible everywhere else.
        run: |
          uid=$(docker compose exec -T api id -u)
          echo "running as uid $uid"
          [ "$uid" = "10001" ] || { echo "expected uid 10001"; exit 1; }

      - name: Walk the quickstart
        run: ./scripts/smoke.sh

      - name: Logs, if any of that failed
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Down
        if: always()
        run: docker compose down --volumes
